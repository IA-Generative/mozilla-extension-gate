replicaCount: 1

image:
  repository: ghcr.io/ia-generative/mozilla-extension-gate/server
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion if not set

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application Configuration
config:
  # Server Configuration
  server:
    env: "production"
    port: "8080"
    publicUrl: "http://localhost:8080"
    basePath: "/"
    version: "1.0"
    instanceId: "gateway-instance"
    artifactBaseUrl: ""
    proxyArtifactEnabled: false

  # GitHub Configuration
  github:
    repository: ""
    syncInterval: "5m"

  # S3 Configuration
  s3:
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    accessKeyId: ""
    secretAccessKey: ""

  # Path prefixes
  artifactsPrefix: "artifacts"
  manifestsPrefix: "manifests"

# Secrets configuration
# Each secret can be provided as:
#
# EXAMPLES:
#
# Option 1: Plaintext (development only - never commit secrets!)
# secrets:
#   github:
#     token:
#       value: "ghp_xxxxxxxxxxxx"
#   s3:
#     accessKeyId:
#       value: "rustfsadmin"
#     secretAccessKey:
#       value: "rustfsadmin123"
#
# Option 2: Reference existing K8s Secrets (recommended for production)
# kubectl create secret generic github-credentials --from-literal=token="ghp_..."
# kubectl create secret generic s3-credentials \
#   --from-literal=access-key-id="AKIA..." \
#   --from-literal=secret-access-key="wJalr..."
#
# Then set in values:
# secrets:
#   github:
#     token:
#       secretKeyRef:
#         name: github-credentials
#         key: token
#   s3:
#     accessKeyId:
#       secretKeyRef:
#         name: s3-credentials
#         key: access-key-id
#     secretAccessKey:
#       secretKeyRef:
#         name: s3-credentials
#         key: secret-access-key
#
secrets:
  github:
    token:
      value: ""
  s3:
    accessKeyId:
      value: ""
    secretAccessKey:
      value: ""

# Environment variables for the pod
env: []

# Node affinity settings
nodeAffinity: {}

# Volume mounts
volumeMounts: []

# Volumes
volumes: []

serviceMonitor:
  # -- Enable a prometheus ServiceMonitor.
  # @section -- Servicename
  enabled: true
  # -- Prometheus ServiceMonitor labels.
  # @section -- Servicename
  labels: {}
  # -- Prometheus ServiceMonitor annotations.
  # @section -- Servicename
  annotations: {}
  endpoints:
  # -- Prometheus ServiceMonitor interval.
  # @section -- Servicename
  - interval: 30s
    # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
    # @section -- Servicename
    scrapeTimeout: 10s
    # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
    # @section -- Servicename
    path: /metrics
    # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
    # @section -- Servicename
    honorLabels: false
    # -- Prometheus RelabelConfigs to apply to samples before scraping.
    # @section -- Servicename
    relabelings: []
    # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
    # @section -- Servicename
    metricRelabelings: []
    # -- Prometheus ServiceMonitor selector.
    # @section -- Servicename
    selector: {}
    # prometheus: kube-prometheus
    # -- Prometheus ServiceMonitor scheme.
    # @section -- Servicename
    scheme: ""
    # -- Prometheus ServiceMonitor tlsConfig.
    # @section -- Servicename
    tlsConfig: {}
