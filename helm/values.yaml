replicaCount: 1

image:
  repository: ghcr.io/ia-generative/mozilla-extension-gate/server
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion if not set

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

initContainer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application Configuration
config:
  # Server Configuration
  server:
    env: "production"
    port: "8080"
    publicUrl: "http://localhost:8080"
    basePath: ""
    version: "1.0"
    instanceId: "gateway-instance"
    artifactBaseUrl: ""
    proxyArtifactEnabled: false

  # GitHub Configuration
  github:
    repository: ""
    syncInterval: "5m"

  # S3 Configuration
  s3:
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    accessKeyId: ""
    secretAccessKey: ""

  fileStorage:
    path: "/addons"
    storageClassName: ""

  storageType: "file"

  # Path prefixes
  artifactsPrefix: "artifacts"
  manifestsPrefix: "manifests"

  # TLS configuration
  tls:
    insecureSkipVerify: false

# Environment variables for the pod
env: []

# HTTP proxy settings — Go's standard library picks these up automatically.
# Example:
# proxy:
#   httpProxy: "http://proxy.example.com:3128"
#   httpsProxy: "http://proxy.example.com:3128"
#   noProxy: "localhost,127.0.0.1,.cluster.local"
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

# Node affinity settings
nodeAffinity: {}

# Extra CA certificates to inject into the pod's trust store.
# Each key is the filename (must end with .crt), value is the PEM-encoded certificate.
# Example:
# extraCAs:
#   my-internal-ca.crt: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
extraCAs: {}

# Volume mounts
volumeMounts: []

# Volumes
volumes: []

serviceMonitor:
  # -- Enable a prometheus ServiceMonitor.
  # @section -- Servicename
  enabled: true
  # -- Prometheus ServiceMonitor labels.
  # @section -- Servicename
  labels: {}
  # -- Prometheus ServiceMonitor annotations.
  # @section -- Servicename
  annotations: {}
  endpoints:
  # -- Prometheus ServiceMonitor interval.
  # @section -- Servicename
  - interval: 30s
    # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
    # @section -- Servicename
    scrapeTimeout: 10s
    # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
    # @section -- Servicename
    path: /metrics
    # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
    # @section -- Servicename
    honorLabels: false
    # -- Prometheus RelabelConfigs to apply to samples before scraping.
    # @section -- Servicename
    relabelings: []
    # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
    # @section -- Servicename
    metricRelabelings: []
    # -- Prometheus ServiceMonitor selector.
    # @section -- Servicename
    selector: {}
    # prometheus: kube-prometheus
    # -- Prometheus ServiceMonitor scheme.
    # @section -- Servicename
    scheme: ""
    # -- Prometheus ServiceMonitor tlsConfig.
    # @section -- Servicename
    tlsConfig: {}
