apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mozilla-extension-gate.fullname" . }}
  labels:
    {{- include "mozilla-extension-gate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mozilla-extension-gate.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    type: {{ .type | default "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .rollingUpdate.maxUnavailable | default 1 }}
      maxSurge: {{ .rollingUpdate.maxSurge | default 1 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mozilla-extension-gate.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mozilla-extension-gate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.extraCAs }}
      initContainers:
      - name: ca-certs-injector
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        command:
        - /bin/sh
        - -c
        - cat /etc/ssl/certs/ca-certificates.crt /extra-cas/* > /ssl-certs/ca-certificates.crt

        resources:
          {{- toYaml .Values.initContainer.resources | nindent 12 }}

        volumeMounts:
        - name: extra-cas
          mountPath: /extra-cas
        - name: ssl-certs
          mountPath: /ssl-certs
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.server.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "mozilla-extension-gate.fullname" . }}
        env:
        # GitHub Token
        {{- with .Values.config.github.token }}
        - name: GITHUB_TOKEN
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # S3 Access Key ID
        {{- with .Values.config.s3.accessKeyId }}
        - name: S3_ACCESS_KEY_ID
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # S3 Secret Access Key
        {{- with .Values.config.s3.secretAccessKey }}
        - name: S3_SECRET_ACCESS_KEY
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # Proxy settings
        {{- with .Values.proxy.httpProxy }}
        - name: HTTP_PROXY
          value: {{ . | quote }}
        - name: http_proxy
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.proxy.httpsProxy }}
        - name: HTTPS_PROXY
          value: {{ . | quote }}
        - name: https_proxy
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.proxy.noProxy }}
        - name: NO_PROXY
          value: {{ . | quote }}
        - name: no_proxy
          value: {{ . | quote }}
        {{- end }}
        # Additional custom environment variables
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        livenessProbe:
          httpGet:
            path: {{ .Values.config.server.basePath }}/healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: {{ .Values.config.server.basePath }}/readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5

        resources:
          {{- toYaml .Values.resources | nindent 12 }}

        {{- if or .Values.volumeMounts .Values.extraCAs (eq .Values.config.storageType "file") }}
        volumeMounts:
          {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.extraCAs }}
          - name: ssl-certs
            mountPath: /etc/ssl/certs
            readOnly: true
          {{- end }}
          {{- if eq .Values.config.storageType "file" }}
          - name: addons
            mountPath: {{ .Values.config.fileStorage.path }}
          {{- end }}
        {{- end }}

      {{- if or .Values.volumes .Values.extraCAs (eq .Values.config.storageType "file") }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.extraCAs }}
        - name: extra-cas
          configMap:
            name: {{ include "mozilla-extension-gate.fullname" . }}-extra-cas
        - name: ssl-certs
          emptyDir: {}
        {{- end }}
        {{- if eq .Values.config.storageType "file" }}
        - name: addons
          persistentVolumeClaim:
            claimName: {{ include "mozilla-extension-gate.fullname" . }}-addons
        {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
