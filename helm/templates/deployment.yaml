apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mozilla-extension-gate.fullname" . }}
  labels:
    {{- include "mozilla-extension-gate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mozilla-extension-gate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mozilla-extension-gate.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mozilla-extension-gate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.server.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "mozilla-extension-gate.fullname" . }}
        env:
        # GitHub Token
        {{- with .Values.config.github.token }}
        - name: GITHUB_TOKEN
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # S3 Access Key ID
        {{- with .Values.config.s3.accessKeyId }}
        - name: S3_ACCESS_KEY_ID
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # S3 Secret Access Key
        {{- with .Values.config.s3.secretAccessKey }}
        - name: S3_SECRET_ACCESS_KEY
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        # Additional custom environment variables
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5

        resources:
          {{- toYaml .Values.resources | nindent 12 }}

        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
