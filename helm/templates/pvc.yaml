{{- if eq .Values.config.storageType "file" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mozilla-extension-gate.fullname" . }}-addons
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  {{- with .Values.config.fileStorage.storageClassName }}
  storageClassName: {{ . | default "" }}
  {{- end }}
{{- end }}